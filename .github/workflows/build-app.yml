# Проверка сборки приложения.
#
# Раньше каждый пуш уходил в продакшн непроверенным, и сломанная сборка
# обнаруживалась только на телефоне. Теперь опечатка в коде видна здесь,
# до того как Vercel выложит её людям.
name: Build app

on:
  push:
    paths:
      - "couple-questions-app/**"
      - ".github/workflows/build-app.yml"
  pull_request:
    paths:
      - "couple-questions-app/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: couple-questions-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: couple-questions-app/package-lock.json

      - run: npm ci
      - run: npx vite build
