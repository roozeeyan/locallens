<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#EFEBE2" />
    <title>Relationship Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/fonts.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; overflow-x: hidden; background: #EFEBE2; }
      /* Двойное касание и щипок больше не масштабируют приложение. */
      html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
      body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
      button { font: inherit; }
      textarea, input { font: inherit; }
      /* Кольцо фокуса без отступа: с отступом оно не повторяет скругление
         и на iOS расходится неровно. */
      :focus-visible { outline: 3px solid var(--rg-accent, #B6CDDD); outline-offset: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
